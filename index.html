<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff6a00">
  <title>EditaAI — Edição de fotos com IA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    :root {
      --orange: #ff6a00;
      --orange-light: #ff8a33;
      --bg: #080808;
      --card: #111111;
      --card-2: #171717;
      --border: #292929;
      --text: #ffffff;
      --muted: #999999;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 0%, rgba(255,106,0,.18), transparent 32%),
        var(--bg);
      overflow-x: hidden;
    }

    /* HEADER */

    header {
      width: 100%;
      padding: 18px 20px;
      border-bottom: 1px solid #202020;
      background: rgba(8,8,8,.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 1050px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo span {
      color: var(--orange);
    }

    .badge {
      font-size: 12px;
      padding: 7px 11px;
      border: 1px solid rgba(255,106,0,.35);
      background: rgba(255,106,0,.08);
      color: #ff9b55;
      border-radius: 999px;
    }

    /* MAIN */

    .container {
      width: 100%;
      max-width: 1050px;
      margin: auto;
      padding: 55px 20px 70px;
    }

    .hero {
      text-align: center;
      max-width: 720px;
      margin: auto;
    }

    .mascot {
      width: 105px;
      height: 105px;
      margin: 0 auto 20px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 35%, #333, #121212 70%);
      border: 1px solid #303030;
      box-shadow: 0 0 45px rgba(255,106,0,.18);
      font-size: 62px;
    }

    h1 {
      font-size: clamp(34px, 7vw, 60px);
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 17px;
    }

    h1 span {
      color: var(--orange);
    }

    .subtitle {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.6;
      max-width: 560px;
      margin: auto;
    }

    /* EDITOR */

    .editor {
      max-width: 680px;
      margin: 42px auto 0;
      padding: 18px;
      background: rgba(17,17,17,.92);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: 0 25px 70px rgba(0,0,0,.45);
    }

    .upload {
      min-height: 235px;
      width: 100%;
      border: 2px dashed #3a3a3a;
      border-radius: 21px;
      background: #0e0e0e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: .25s ease;
      padding: 25px;
    }

    .upload:hover,
    .upload:active {
      border-color: var(--orange);
      background: rgba(255,106,0,.045);
      transform: translateY(-2px);
    }

    .upload-icon {
      width: 62px;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: rgba(255,106,0,.12);
      font-size: 30px;
      margin-bottom: 15px;
    }

    .upload strong {
      font-size: 18px;
    }

    .upload p {
      color: #777;
      font-size: 13px;
      margin-top: 8px;
    }

    input[type="file"] {
      display: none;
    }

    /* PREVIEW */

    .preview-box {
      display: none;
      margin-top: 18px;
      position: relative;
      overflow: hidden;
      border-radius: 21px;
      border: 1px solid #303030;
      background: #000;
    }

    .preview {
      display: block;
      width: 100%;
      max-height: 500px;
      object-fit: contain;
    }

    .remove-photo {
      position: absolute;
      top: 12px;
      right: 12px;
      border: none;
      background: rgba(0,0,0,.75);
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 17px;
    }

    /* PROMPT */

    .prompt-area {
      margin-top: 18px;
    }

    .prompt-label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      color: #ccc;
      font-weight: bold;
    }

    .prompt {
      width: 100%;
      min-height: 105px;
      resize: vertical;
      padding: 16px;
      border-radius: 17px;
      border: 1px solid #303030;
      background: var(--card-2);
      color: white;
      outline: none;
      font-size: 16px;
      line-height: 1.5;
      transition: .2s;
    }

    .prompt:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255,106,0,.1);
    }

    .prompt::placeholder {
      color: #666;
    }

    /* BUTTON */

    .button {
      width: 100%;
      margin-top: 16px;
      min-height: 57px;
      border: none;
      border-radius: 17px;
      background: linear-gradient(135deg, var(--orange), #ff4500);
      color: white;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(255,106,0,.2);
      transition: .2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(255,106,0,.3);
    }

    .button:active {
      transform: scale(.98);
    }

    /* STATUS */

    .status {
      min-height: 22px;
      text-align: center;
      margin-top: 14px;
      color: #999;
      font-size: 14px;
    }

    /* FEATURES */

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      max-width: 680px;
      margin: 18px auto 0;
    }

    .feature {
      padding: 17px 12px;
      text-align: center;
      background: #101010;
      border: 1px solid #242424;
      border-radius: 17px;
    }

    .feature-icon {
      font-size: 23px;
      margin-bottom: 8px;
    }

    .feature strong {
      display: block;
      font-size: 13px;
    }

    .feature span {
      display: block;
      color: #707070;
      font-size: 11px;
      margin-top: 4px;
    }

    footer {
      text-align: center;
      color: #555;
      font-size: 12px;
      padding: 20px;
    }

    @media (max-width: 600px) {
      header {
        padding: 15px;
      }

      .logo {
        font-size: 24px;
      }

      .badge {
        font-size: 10px;
      }

      .container {
        padding: 38px 14px 45px;
      }

      .mascot {
        width: 88px;
        height: 88px;
        font-size: 51px;
        border-radius: 25px;
      }

      h1 {
        font-size: 39px;
      }

      .subtitle {
        font-size: 15px;
      }

      .editor {
        margin-top: 30px;
        padding: 12px;
        border-radius: 23px;
      }

      .upload {
        min-height: 210px;
      }

      .features {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">Edita<span>AI</span></div>
    <div class="badge">✨ IA para suas fotos</div>
  </div>
</header>

<main class="container">

  <section class="hero">

    <div class="mascot">👻</div>

    <h1>
      Edite suas fotos<br>
      com <span>IA.</span>
    </h1>

    <p class="subtitle">
      Envie sua foto, diga o que deseja mudar
      e deixe a inteligência artificial fazer o trabalho.
    </p>

  </section>

  <section class="editor">

    <label class="upload" for="photo">

      <input type="file" id="photo" accept="image/*">

      <div class="upload-icon">📸</div>

      <strong>Escolha uma foto</strong>

      <p>
        Toque aqui para selecionar uma imagem
      </p>

    </label>

    <div class="preview-box" id="previewBox">

      <img id="preview" class="preview">

      <button
        class="remove-photo"
        type="button"
        onclick="removerFoto()">
        ✕
      </button>

    </div>

    <div class="prompt-area">

      <label class="prompt-label" for="prompt">
        O que você quer alterar?
      </label>

      <textarea
        id="prompt"
        class="prompt"
        placeholder="Ex: remova a pessoa do fundo, melhore a qualidade, troque o fundo..."
      ></textarea>

    </div>

    <button
      class="button"
      type="button"
      onclick="editar()">
      ✨ Editar com IA
    </button>

    <div id="status" class="status"></div>

  </section>

  <section class="features">

    <div class="feature">
      <div class="feature-icon">⚡</div>
      <strong>Rápido</strong>
      <span>Edição simples</span>
    </div>

    <div class="feature">
      <div class="feature-icon">🎨</div>
      <strong>Inteligente</strong>
      <span>Com IA</span>
    </div>

    <div class="feature">
      <div class="feature-icon">📱</div>
      <strong>Responsivo</strong>
      <span>Celular e PC</span>
    </div>

  </section>

</main>

<footer>
  EditaAI © 2026 — Edição de imagens com inteligência artificial
</footer>

<script>

  const photo = document.getElementById("photo");
  const preview = document.getElementById("preview");
  const previewBox = document.getElementById("previewBox");
  const status = document.getElementById("status");

  photo.addEventListener("change", function() {

    const file = this.files[0];

    if (!file) return;

    preview.src = URL.createObjectURL(file);

    previewBox.style.display = "block";

    status.innerText = "Foto carregada ✓";

  });

  function removerFoto() {

    photo.value = "";

    preview.src = "";

    previewBox.style.display = "none";

    status.innerText = "";

  }

  function editar() {

    const prompt = document.getElementById("prompt").value.trim();

    if (!photo.files[0]) {

      status.innerText = "📸 Escolha uma foto primeiro.";

      return;

    }

    if (!prompt) {

      status.innerText = "✍️ Diga o que você quer editar.";

      return;

    }

    status.innerText = "🤖 Preparando sua edição com IA...";

  }

</script>

</body>
</html>
